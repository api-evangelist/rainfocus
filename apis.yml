apis:
- aid: rainfocus-platform-api
  name: RainFocus Platform API
  description: >-
    The RainFocus RESTful integration API. Requests are dispatched against api.rainfocus.com and
    are keyed on an apiProfile identifier - a named API Profile configured per customer in the
    RainFocus Integration Suite that declares which endpoints (Attendee Store, session,
    registration, exhibitor and similar) are enabled and how fields are mapped. Unauthenticated
    requests to any /api path return the RainFocus JSON error envelope
    {"responseCode","responseMessage"} with HTTP 400 and "Required parameter missing: apiProfile".
    Credentials are OAuth (Global) client ID and client secret issued per profile. No public
    OpenAPI or reference site is published; documentation is delivered through the RainFocus Help
    Center and the customer SOW.
  humanURL: https://www.rainfocus.com/why-rainfocus/integrations/
  baseURL: https://api.rainfocus.com/api
  tags:
  - Event
  - Registration
  - Attendee Data
  - Integration
  tags_raw:
  - Events
  - Registration
  - Attendee Data
  - Integrations
