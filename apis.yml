aid: rainfocus
name: RainFocus
description: >-
  RainFocus is a Lehi, Utah based enterprise event management and event marketing platform used by
  large B2B organizations to run conferences, roadshows, field-marketing programs, kickoffs and
  webinars from a single data-first system. The platform spans registration, call for papers,
  speaker enablement, sponsor and exhibitor activation, meetings management, on-site check-in and
  badge printing, a mobile app, and portfolio-level analytics, all anchored on a Global Attendee
  Profile. Its developer surface is delivered as a customer-provisioned "Integration Suite":
  RESTful APIs at api.rainfocus.com governed by named API Profiles with modular field mappings and
  OAuth (Global) client credentials, plus RainFocus Nexus MCP Profiles - an OAuth-secured remote
  Model Context Protocol server at api.rainfocus.com/mcp/ that lets AI agents read live session
  capacity, check-in status, attendee, exhibitor and session records and write back changes such as
  closing registration or updating speaker details, with per-event scoping and audit logging. No
  OpenAPI, GraphQL, AsyncAPI, WSDL or Protobuf contract is published to the public web; API and MCP
  reference material lives behind the RainFocus Help Center and the customer statement of work.
