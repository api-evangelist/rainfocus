    url: authentication/rainfocus-authentication.yml
  - type: OAuthScopes
    url: scopes/rainfocus-scopes.yml
  - type: ErrorCatalog
    url: errors/rainfocus-problem-types.yml
  - type: Conventions
    url: conventions/rainfocus-conventions.yml
  - type: RateLimits
    url: rate-limits/rainfocus-rate-limits.yml
- aid: rainfocus-mcp
  name: RainFocus Nexus MCP Profiles
  description: >-
    RainFocus Nexus MCP Profiles, announced 7 July 2026, is a first-party remote Model Context
    Protocol server that exposes live RainFocus event data to AI clients. The endpoint answers at
    https://api.rainfocus.com/mcp/ and is OAuth-gated: an unauthenticated tools/list POST returns
    HTTP 401 "Access token not found in mcp request" with a WWW-Authenticate Bearer challenge
    carrying RFC 9728 resource_metadata, and the authorization server is the RainFocus OIDC
    provider at https://events.rainfocus.com/oidc. Per the launch announcement the tool surface is
    bidirectional - reading session capacity, check-in status, attendee, exhibitor and session
    records, and writing changes such as closing registration or updating speaker details - with
    per-user authentication, role-based access control, per-event scoping and audit logging. The
    live tool list and input schemas require an authenticated introspection.
  humanURL: https://www.rainfocus.com/company/news-press/rainfocus-launches-ai-agent-connectivity-for-event-data-with-mcp-profiles/
  baseURL: https://api.rainfocus.com/mcp/
  tags:
  - MCP
  - Agents
  - Event
  tags_raw:
  - MCP
  - Agents
  - Events
  properties:
  - type: MCPServer
    url: mcp/rainfocus-mcp.yml
  - type: Authentication
    url: authentication/rainfocus-authentication.yml
