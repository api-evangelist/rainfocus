description: >-
  RainFocus Nexus MCP Profiles is a first-party, hosted, remote Model Context Protocol server for
  live event data. It was announced on 7 July 2026 and RainFocus describes it as "the first native
  MCP with an enterprise-grade OAuth security layer" for event management. An MCP Profile is
  configured per customer in the RainFocus Integration Suite (Integration Suite > Active Profiles >
  MCP Profiles); the client authenticates over OAuth and receives a generated server URL, so the
  tenant-specific URL a given customer uses is provisioned, not published. The shared entry point
  is live and answers MCP requests today.
