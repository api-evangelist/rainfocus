source: live GET of each /.well-known/ path on every RainFocus host
description: >-
  RainFocus serves a real machine-readable identity and MCP discovery surface on its API and
  events hosts. api.rainfocus.com publishes OpenID Connect Discovery, RFC 8414 authorization-server
  metadata and RFC 9728 protected-resource metadata, all pointing at the RainFocus OIDC provider at
  https://events.rainfocus.com/oidc; events.rainfocus.com serves the same three documents plus a
  per-resource RFC 9728 document for the MCP endpoint, referenced from the WWW-Authenticate Bearer
  challenge returned by an unauthenticated MCP request. No security.txt, api-catalog, ai-plugin,
  llms.txt or A2A agent card is served anywhere. Neither api.rainfocus.com nor events.rainfocus.com
  is a soft-404 catch-all - a control probe of /.well-known/zzz-control-xyz returned a genuine 404
  on both. www.rainfocus.com is S3-fronted and answers 403 AccessDenied (its equivalent of not
  found) for every /.well-known/* path and for /llms.txt.
