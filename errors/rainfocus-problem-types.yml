gaps:
- No published error code reference or dictionary.
- No RFC 9457 application/problem+json representation.
- No request or trace identifier returned in the error envelope, despite the API accepting W3C traceparent and tracestate request headers.
- Error bodies vary in content type across surfaces (JSON on REST, text/plain on MCP, HTML on 404).
