  remediation: >-
    Follow the RFC 9728 protected-resource metadata to https://events.rainfocus.com/oidc, obtain a
    bearer token and resend with an Authorization header.
  note: >-
    A plain-text body on a JSON-RPC endpoint. A conforming MCP client expecting a JSON-RPC error
    object will not parse this.
- code: null
  http_status: 404
